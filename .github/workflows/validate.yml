name: Validate Poster Genome
on:
  push:
  pull_request:

jobs:
  python-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validator
        run: python -m pip install -r requirements-dev.txt
      - name: Check Python syntax
        run: python -m compileall -q skills/poster-genome/scripts tests
      - name: Validate genome library and example documents
        run: python skills/poster-genome/scripts/validate_library.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Test example CLI ranking
        run: python skills/poster-genome/scripts/match_genomes.py --input skills/poster-genome/examples/brief-example.json --top 2 --json

  skill-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check skill discovery (remote repository)
        run: |
          npx --yes skills add gmchocolate/poster-genome --list | tee /tmp/skill-list.txt
          grep -q 'poster-genome' /tmp/skill-list.txt
      - name: Install skill from checked-out directory
        run: |
          temp_dir="$(mktemp -d)"
          cd "$temp_dir"
          npx --yes skills add "$GITHUB_WORKSPACE" --skill poster-genome --agent codex --yes
          test -f ".agents/skills/poster-genome/SKILL.md"
          test -f ".agents/skills/poster-genome/references/analysis-framework.md"
          test -f ".agents/skills/poster-genome/genomes/cinematic-editorial.json"
          test -f ".agents/skills/poster-genome/scripts/match_genomes.py"
          test -f ".agents/skills/poster-genome/requirements-dev.txt"
          test -f ".agents/skills/poster-genome/requirements-render.txt"
          test -f ".agents/skills/poster-genome/LICENSE"
