name: Validate Poster Genome
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validator
        run: python -m pip install -r requirements-dev.txt
      - name: Check Python syntax
        run: python -m compileall -q scripts tests
      - name: Validate genome library and example documents
        run: python scripts/validate_library.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Test example CLI ranking
        run: python scripts/match_genomes.py --input examples/brief-example.json --top 2 --json
